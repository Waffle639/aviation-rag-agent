[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --strict-config --cov=ingestion --cov=rag --cov=configure --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = [
    "live: tests that call real external services (Supabase, OpenAI, HuggingFace). Enable with --live.",
    "integration_db: tests that require an ephemeral PostgreSQL/pgvector container.",
    "e2e: mocked end-to-end tests of the application pipeline.",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["ingestion", "rag", "configure"]
branch = true

omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 80
